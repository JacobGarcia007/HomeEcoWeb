  clear: both;

/* Footer */

  text-align: right;
  background: white;

}

}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other */

    width: 100%;
    padding: 0;

}

/* Responsive layout - when the screen is less than 400px wide, make the navigation links stack on top of each other instead of next to each other */

<script>
let slideIndex = 0;
showSlides();

function showSlides() {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  slideIndex++;
  if (slideIndex > slides.length) {slideIndex = 1}    
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
  setTimeout(showSlides, 3000); // Change image every 3 seconds
}
</script>

<div class="row">
  <div class="leftcolumn">

      <div class="gallery-container">

        <!-- Main Video -->
        <div class="gallery-slide">
          <video id="mainVideo" controls>
            <source src="bandpcommit.mp4" type="video/mp4">
            Your browser does not support video.
          </video>
          <div class="caption-bar" id="captionText">Bread & Pastry</div>
        </div>

        <!-- Arrows -->
        <a class="prev" onclick="changeVideo(-1)">❮</a>
        <a class="next" onclick="changeVideo(1)">❯</a>

        <!-- Thumbnails -->
        <div class="thumbnail-row">
          <video class="thumb active-thumb" onclick="setVideo(0)">
            <source src="bandpcommit.mp4" type="video/mp4">
          </video>

          <video class="thumb" onclick="setVideo(1)">
            <source src="cookinvent.mp4" type="video/mp4">
          </video>

          <video class="thumb" onclick="setVideo(2)">
            <source src="fandb.mp4" type="video/mp4">
          </video>

          <video class="thumb" onclick="setVideo(3)">
            <source src="housekeep.mp4" type="video/mp4">
          </video>
        </div>

      </div>

        <script>
        let currentIndex = 0;

        const videos = [
          "bandpcommit.mp4",
          "cookinvent.mp4",
          "fandb.mp4",
          "housekeep.mp4",
        ];

        const captions = [
          "Bread & Pastry",
          "Cookery & Baking",
          "Food & Beverages Services",
          "Housekeeping",
        ];

        function updateGallery() {
          const mainVideo = document.getElementById("mainVideo");
          mainVideo.src = videos[currentIndex];
          mainVideo.load();
          mainVideo.play();

          document.getElementById("captionText").innerText = captions[currentIndex];

          let thumbs = document.querySelectorAll(".thumb");
          thumbs.forEach(t => t.classList.remove("active-thumb"));
          thumbs[currentIndex].classList.add("active-thumb");
        }

        function changeVideo(n) {
          currentIndex += n;
          if (currentIndex >= videos.length) currentIndex = 0;
          if (currentIndex < 0) currentIndex = videos.length - 1;
          updateGallery();
        }

        function setVideo(n) {
          currentIndex = n;
          updateGallery();
        }
        </script>

      </div>
